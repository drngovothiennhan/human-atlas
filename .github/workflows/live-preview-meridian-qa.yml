name: Live Preview Meridian QA

on:
  push:
    branches:
      - qa/live-preview-daf10

permissions:
  contents: read

jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Test live Render preview
        env:
          LIVE_PREVIEW_URL: https://hiu-yhct-3d-atlas-preview.onrender.com/
        run: node scripts/live-preview-smoke.mjs
      - name: Verify pulsing acupoint visual activity
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from collections import deque
          a=Image.open('artifacts/live-preview/effect-a.png').convert('RGB')
          b=Image.open('artifacts/live-preview/effect-b.png').convert('RGB')
          diff=ImageChops.difference(a,b)
          w,h=diff.size
          pix=diff.load()
          mask=set()
          for y in range(h):
              for x in range(w):
                  r,g,bb=pix[x,y]
                  if max(r,g,bb)>=20 and (r+g+bb)>=45:
                      mask.add((x,y))
          seen=set();components=0;large=0
          for p in list(mask):
              if p in seen: continue
              components+=1
              q=[p];seen.add(p);n=0
              while q:
                  x,y=q.pop();n+=1
                  for nx,ny in ((x+1,y),(x-1,y),(x,y+1),(x,y-1)):
                      if (nx,ny) in mask and (nx,ny) not in seen:
                          seen.add((nx,ny));q.append((nx,ny))
              if n>=3: large+=1
          print(f'LIVE_PREVIEW_PIXEL_DIFF changed_pixels={len(mask)} components={components} components_ge3={large}')
          if len(mask)<150 or large<8:
              raise SystemExit('Insufficient distributed visual motion for meridian/acupoint pulse evidence')
          print('LIVE_PREVIEW_ACUPOINT_PULSE_VISUAL_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview-meridian-evidence
          path: artifacts/live-preview/
          if-no-files-found: error
