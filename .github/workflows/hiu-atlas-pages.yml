name: Deploy HIU YHCT Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-hiu-atlas
  cancel-in-progress: true
env:
  VITE_BUILD_SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - run: npm run source:furia:validate
      - run: npm run content:build
      - run: npm run architecture:validate
      - run: npm run check
      - run: node scripts/validate-atlas.mjs
      - run: node --experimental-strip-types scripts/validate-interactions.mjs
      - run: npm test
      - run: npm run build:pages
      - run: npm run verify:pages
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-browser-evidence
          path: artifacts/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

